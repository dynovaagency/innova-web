[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

# Functions individuales (aliases más cortos si algún día queremos)
[functions]
  node_bundler = "esbuild"

# Redirect 301 — la ruta vieja de la cápsula (single) fue reemplazada por
# el listado dinámico. Cualquier link viejo (bookmark, mail histórico,
# Google) llega ahora a la cápsula específica.
[[redirects]]
  from = "/servicios/capsula-formativa"
  to = "/servicios/vulnerabilidad-social"
  status = 301
  force = true

# SPA fallback — soporte para rutas de React Router
# (también está en public/_redirects, pero acá queda explícito)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Las páginas de curso solo se acceden por link privado (redirect post-pago de MP).
# X-Robots-Tag le dice a los crawlers que no las indexen ni sigan sus links.
[[headers]]
  for = "/curso/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/pago-pendiente"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/pago-fallido"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/mock-checkout"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Panel de administración — rutas internas para el equipo de Innova.
# No queremos que Google las indexe ni las siga.
[[headers]]
  for = "/admin"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"